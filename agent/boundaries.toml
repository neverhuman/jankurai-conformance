# Boundary manifest for jankurai-conformance.
# This is a single-purpose data/corpus repository: the jankurai conformance
# fixtures and expected reports. There is no committed web, database, queue, or
# Python product surface here, so those stack arms of the family standard do not
# apply. See docs/boundaries.md for prose.

[stack]
id = "rust-ts-vite-react-postgres-bounded-python"
version = "0.5.0"

# The corpus is data, not source. The fixtures deliberately embed failing
# patterns so the auditor can prove detection; they are excluded from this
# repo's own self-audit scoring via agent/audit-policy.toml [scan].
[corpus]
fixtures_path = "conformance/fixtures"
expected_path = "conformance/expected"
classification = "adversarial-test-data"
scored_as_product = false
