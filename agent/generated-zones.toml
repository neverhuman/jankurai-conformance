# Generated zones for jankurai-conformance.
# This is a data/corpus repository. The only generated output tree that exists
# here is target/, produced when the conformance runner replays the fixtures and
# writes results plus the paper table. It is never hand-edited and is
# regenerated by the runner command below.

[[zone]]
path = "target/"
source = "conformance/fixtures + conformance/expected (jankurai conformance run)"
command = "bash scripts/ci-local.sh required"
read_only = true
write_policy = "generated_output"
